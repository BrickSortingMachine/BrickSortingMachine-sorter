name: Unit Test VEnv Fixed

on: [push]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: 'false'

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: '3.11'

    - name: Download test data
      run: |
        python tools/download_unpack_test_data.py

    - name: Create virtual environment
      run: |
        python -m venv .venv
        echo ".venv/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_311_linux_unittest_fixed.txt

    - name: Lint with flake8
      run: |
        # uses .flake8 config
        flake8 . --count --show-source --statistics
    - name: Test with unittest and collect coverage
      run: |
        coverage run -m unittest discover -s ./test  -p 'test_*.py' --failfast --buffer
    - name: Generate coverage report
      run: |
        coverage report -m
        coverage html
    - name: Create coverage comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov
